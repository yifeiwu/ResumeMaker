<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Resume Builder — self test</title>
<style>body{font-family:Arial,sans-serif;max-width:760px;margin:24px auto;padding:0 16px}.pass{color:#15803d}.fail{color:#b91c1c}li{margin:4px 0}</style>
</head>
<body>
<h1>Resume Builder self-test</h1>
<p>Runs core checks against <code>app.js</code> (no network, no build). Serve over http: <code>python -m http.server 8000</code> then open <code>/test.html</code>.</p>
<ul id="results"></ul>
<div id="editor" hidden></div><div id="sheet" hidden></div>
<script src="app.js"></script>
<script>
const out = [];
function t(name, fn) { try { fn(); out.push([true, name]); } catch (e) { out.push([false, name + " — " + e.message]); } }
function eq(a, b, m) { if (a !== b) throw new Error((m || "mismatch") + ": " + JSON.stringify(a) + " !== " + JSON.stringify(b)); }
function ok(v, m) { if (!v) throw new Error(m || "expected truthy"); }
function no(v, m) { if (v) throw new Error(m || "expected falsy"); }
const R = () => window.ResumeTest;

t("Test hooks exposed", () => ok(R(), "missing ResumeTest"));
t("schema version is a single source of truth", () => {
  eq(R().SCHEMA_VERSION, 1, "schema");
  eq(R().defaultState().version, R().SCHEMA_VERSION, "default state version");
  eq(R().currentEnvelope().version, R().SCHEMA_VERSION, "envelope version");
});
t("sampleState has 3 jobs, breaks, skill groups, no profile leftovers", () => {
  const s = R().sampleState();
  eq(s.experience.length, 3, "jobs");
  ok(s.experience.some(j => j.breakBefore), "no breakBefore demo");
  ok(s.skillGroups.length >= 2, "skill groups");
  no("profileName" in s, "profileName should not exist in a single-resume app");
});
t("migrate repairs junk and drops profile fields", () => {
  const m = R().migrate({ contact: { fullName: "X" }, profileName: "old", sectionsVisible: { summary: true }, customSections: [{ title: "T", bullets: ["a", "b"] }] });
  ok(Array.isArray(m.experience) && Array.isArray(m.sectionOrder), "arrays");
  eq(m.settings.templateId, "ats", "template default");
  no("profileName" in m, "profileName not stripped");
  eq(m.customSections[0].items.length, 2, "legacy bullets → items");
  eq(m.customSections[0].items[0].text, "a", "item text");
  eq(R().migrate({ settings: { templateId: "evil" } }).settings.templateId, "ats", "bad template");
  eq(R().migrate({ settings: { accent: "not-a-colour" } }).settings.accent, "#1d4ed8", "bad accent");
  eq(R().migrate([]), null, "array must be rejected");
  eq(R().migrate("nope"), null, "string must be rejected");
});
t("validate accepts envelope + raw, rejects garbage and wrong types", () => {
  no(R().validateResumeFile({ version: 1, data: { contact: {}, experience: [] } }), "envelope rejected");
  no(R().validateResumeFile({ contact: {}, experience: [] }), "raw rejected");
  ok(R().validateResumeFile({ foo: 1 }), "garbage accepted");
  ok(R().validateResumeFile([]), "array accepted");
  ok(R().validateResumeFile({ experience: "x", contact: {} }), "bad type accepted");
  ok(R().validateResumeFile({ contact: "nope" }), "string contact accepted");
  ok(R().validateResumeFile({ contact: {}, settings: [] }), "array settings accepted");
  ok(R().validateResumeFile({ contact: {}, summary: 5 }), "number summary accepted");
  ok(R().validateResumeFile({ contact: {}, skillGroups: {} }), "object skillGroups accepted");
});
t("JSON round-trip preserves content", () => {
  const env = JSON.parse(JSON.stringify({ version: 1, data: R().sampleState() }));
  eq(R().normalizeImport(env).contact.fullName, "Alex Morgan", "name lost");
  eq(R().normalizeImport(env).experience.length, 3, "jobs lost");
  eq(R().normalizeImport({ contact: { fullName: "Solo" } }).contact.fullName, "Solo", "raw import");
});
t("bullet coach flags weak/long/metric-less", () => {
  ok(R().lintBullet("Responsible for stuff").length > 0, "weak start not flagged");
  ok(R().lintBullet("Did things").some(w => /metric/i.test(w)), "missing metric not flagged");
  eq(R().lintBullet("Led 4-engineer squad; cut load 43%. Shipped X Han Solo style wins here.").length, 0, "good bullet flagged");
});
t("JD keywords normalise aliases and plurals", () => {
  const kws = R().extractJdKeywords("We need React, TypeScript and CI/CD experience with accessibility. Also k8s and Node.js experience.");
  ["react", "typescript", "kubernetes", "node.js"].forEach(k => ok(kws.includes(k), "missing " + k));
  no(kws.includes("k8s"), "alias not canonicalised");
  no(kws.includes("require"), "no stopword filtering");
});
t("JD score weights requirement lines higher", () => {
  R().setState(R().sampleState());
  R().getState().jdText = "Nice to have:\nKubernetes\n\nRequirements:\nReact and TypeScript, plus Rust and Elixir";
  const jd = R().jdResult();
  ok(jd.total > 0, "no keywords");
  ok(jd.matched.includes("react"), "react missing from the sample resume");
  ok(jd.missing.includes("rust"), "rust should be missing from the sample resume");
  ok(jd.score > 0 && jd.score < 100, "score looks wrong: " + jd.score);
});
t("JD matcher matches short terms on whole words only", () => {
  R().setState(R().defaultState());
  R().getState().summary = "Good team player with MongoDB experience.";
  R().getState().jdText = "Requirements:\nGolang expertise needed for this backend role, plus React skills";
  const jd = R().jdResult();
  ok(jd && jd.total > 0, "no keywords");
  ok(jd.missing.includes("go"), "go should be missing: only Good/MongoDB substrings present");
  R().getState().summary = "Go development for backend services.";
  ok(R().jdResult().matched.includes("go"), "standalone Go should match golang");
});
t("export filenames fall back cleanly for symbol-only names", () => {
  R().setState(R().sampleState());
  R().getState().contact.fullName = "!!!";
  ok(R().exportFilename("json").indexOf("resume-") === 0, "symbol-only name left stray dashes: " + R().exportFilename("json"));
  R().getState().contact.fullName = "Yi Fei Wu";
  ok(R().exportFilename("pdf").indexOf("yi-fei-wu-") === 0, "name slug broken");
});
t("plain-text export reflects state, hides and redaction", () => {
  R().setState(R().sampleState());
  R().getState().experience[0].hidden = true;
  let txt = R().resumeToText();
  ok(txt.includes("Alex Morgan"), "no name");
  no(txt.includes("Northwind Labs"), "hidden job leaked into txt");
  ok(txt.includes("Brightline Health"), "visible job missing");
  ok(!/2013\s*-\s*2017/.test(txt), "education dates should be human readable");
  R().getState().experience[0].hidden = false;
  R().getState().settings.redactPII = true;
  txt = R().resumeToText();
  no(txt.includes("alex.morgan@example.com"), "email not redacted in txt");
  const sheet = R().buildSheetHtml();
  no(sheet.includes("alex.morgan@example.com"), "email not redacted in sheet");
  ok(sheet.includes("Alex Morgan"), "redaction should not remove the name");
  no(/\[email redacted\]|\[phone redacted\]|\[location redacted\]/.test(sheet), "redaction left a placeholder");
});
t("sheet output honours visibility, breaks and print-only hints", () => {
  R().setState(R().sampleState());
  R().getState().sectionsVisible.certifications = false;
  R().getState().sectionBreaks.education = true;
  const html = R().buildSheetHtml();
  ok(html.includes("Experience"), "missing experience");
  ok(html.includes("pb-indicator"), "missing page break");
  no(html.includes("no-print"), "print-only hint leaked into the sheet");
  R().setState(R().defaultState());
  no(R().buildSheetHtml().includes("<li>"), "empty default resume should have no bullets");
});
t("custom sections: legacy shape, per-item hide, paragraph layout", () => {
  R().setState({ contact: { fullName: "A" }, customSections: [{ title: "Vol" }], sectionOrder: ["custom_x"] });
  ok(R().isSectionEmpty("custom_x"), "section without items should be empty, not a crash");
  R().setState({ contact: { fullName: "A" }, customSections: [{ id: "x", title: "Vol", items: [{ text: "kept" }, { text: "gone", hidden: true }] }] });
  no(R().isSectionEmpty("custom_x"), "item should count as content");
  const html = R().buildSheetHtml();
  ok(html.includes("kept"), "visible custom item missing");
  no(html.includes("gone"), "hidden custom item printed");
  R().setState({ contact: { fullName: "A" }, customSections: [{ id: "x", title: "Vol", layout: "text", items: [{ text: "line one\nline two" }] }] });
  ok(R().buildSheetHtml().includes('class="preserve"'), "paragraph layout should preserve line breaks");
});
t("sidebar keeps header and columns on one atomic page", () => {
  R().setState(R().sampleState());
  R().getState().settings.templateId = "sidebar";
  const html = R().buildSheetHtml();
  ok(html.includes('class="r-atomic"'), "sidebar head+cols not wrapped in one atomic block");
  ok(html.indexOf("r-head") < html.indexOf("r-cols"), "header must lead the atomic block, not orphan alone on page 1");
  ok(html.includes("r-side"), "sidebar column missing");
  R().setState(R().defaultState());
});
const ul = document.getElementById("results");
let fails = 0;
out.forEach(([pass, name]) => {
  if (!pass) fails++;
  const li = document.createElement("li");
  li.className = pass ? "pass" : "fail";
  li.textContent = (pass ? "PASS " : "FAIL ") + name;
  ul.appendChild(li);
});
const h = document.createElement("h2");
h.textContent = fails ? fails + " failing" : "All " + out.length + " checks passed";
h.className = fails ? "fail" : "pass";
document.body.appendChild(h);
</script>
</body>
</html>
